<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Ira ❤️</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05000d;
    font-family: Arial, sans-serif;
}

canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
}

/* CENTER EVERYTHING */

.message {
    position: fixed;

    top: 0;
    left: 0;

    width: 100vw;
    height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    text-align: center;

    pointer-events: none;

    padding: 20px;
}

.text {
    width: 100%;
    max-width: 900px;

    margin: 0 auto;

    color: white;

    text-shadow:
        0 0 10px white,
        0 0 25px #ff4fa3,
        0 0 45px #9d4edd;

    opacity: 0;

    transition: opacity 2s ease;
}

.intro {
    font-size: clamp(24px, 6vw, 50px);

    font-weight: bold;

    letter-spacing: 3px;
}

.final {
    font-size: clamp(18px, 4vw, 30px);

    line-height: 1.7;

    text-align: center;

    width: 100%;
}

.name {
    font-size: clamp(70px, 18vw, 150px);

    font-weight: bold;

    color: #ff7ac8;

    margin: 10px 0;

    text-shadow:
        0 0 10px #ff7ac8,
        0 0 30px #ff4fa3,
        0 0 70px #ff1493;
}

.small {
    font-size: clamp(15px, 3vw, 22px);
}

.heart {
    font-size: 70px;

    color: #ff4f9a;

    animation: beat 1s infinite;

    text-shadow:
        0 0 15px #ff4f9a,
        0 0 40px #ff1493;
}

@keyframes beat {

    50% {
        transform: scale(1.25);
    }

}

</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div class="message">

    <div id="intro" class="text intro">

        ✦ ДЛЯ ТЕБЕ, КОХАНА ✦

    </div>


    <div id="final" class="text final">

        <div>
            Кохана...
        </div>

        <div class="name">
            IRA
        </div>

        <div>
            Out of all the stars in the universe,
            <br>
            somehow, my eyes found you. ✨
        </div>

        <br>

        <div>
            Ти особлива для мене ❤️
        </div>

        <br>

        <div class="small">
            YOU'RE MY FAVORITE LITTLE SURPRISE ✨
        </div>

        <div class="heart">
            ♥
        </div>

    </div>

</div>


<script>

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

let W = 0;
let H = 0;

let stars = [];


/* RESIZE */

function resize() {

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W;
    canvas.height = H;
}

resize();

window.addEventListener(
    "resize",
    resize
);


/* STAR */

class Star {

    constructor() {

        this.x =
            Math.random() * W;

        this.y =
            Math.random() * H;

        this.tx = this.x;
        this.ty = this.y;

        this.size =
            Math.random() * 2 + 1;

        this.speed =
            Math.random() * 0.025 + 0.01;

        this.phase =
            Math.random() *
            Math.PI * 2;

        this.brightness =
            Math.random();

    }

    update() {

        this.x +=
            (this.tx - this.x)
            * this.speed;

        this.y +=
            (this.ty - this.y)
            * this.speed;

        this.phase += 0.04;

        const glow =
            0.5 +
            Math.sin(this.phase)
            * 0.5;

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            this.size + glow,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "rgba(255,255,255," +
            (0.5 +
            this.brightness * 0.5) +
            ")";

        ctx.shadowBlur = 15;

        ctx.shadowColor =
            "#ff7ac8";

        ctx.fill();

        ctx.shadowBlur = 0;
    }
}


/* CREATE STARS */

for (
    let i = 0;
    i < 600;
    i++
) {

    stars.push(
        new Star()
    );
}


/* CLEAR */

function clearScreen() {

    ctx.fillStyle =
        "rgba(5,0,13,0.25)";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );
}


/* RANDOM */

function randomTargets() {

    return stars.map(() => {

        return {

            x:
                Math.random() * W,

            y:
                Math.random() * H
        };

    });
}


/* IRA */

function wordTargets(word) {

    const temp =
        document.createElement(
            "canvas"
        );

    const c =
        temp.getContext("2d");

    temp.width = W;
    temp.height = H;

    const size =
        Math.min(
            W * 0.25,
            160
        );

    c.font =
        "bold " +
        size +
        "px Arial";

    c.textAlign = "center";

    c.textBaseline = "middle";

    c.fillStyle = "white";

    c.fillText(
        word,
        W / 2,
        H / 2
    );

    const data =
        c.getImageData(
            0,
            0,
            W,
            H
        ).data;

    const points = [];

    for (
        let y = 0;
        y < H;
        y += 5
    ) {

        for (
            let x = 0;
            x < W;
            x += 5
        ) {

            const index =
                (y * W + x) * 4;

            if (
                data[index + 3] > 100
            ) {

                points.push({
                    x: x,
                    y: y
                });

            }

        }

    }

    return points;
}


/* HEART */

function heartTargets() {

    const points = [];

    const scale =
        Math.min(W, H) / 38;

    for (
        let t = 0;
        t < Math.PI * 2;
        t += 0.025
    ) {

        const x =
            16 *
            Math.pow(
                Math.sin(t),
                3
            );

        const y =
            13 * Math.cos(t)
            - 5 * Math.cos(2 * t)
            - 2 * Math.cos(3 * t)
            - Math.cos(4 * t);

        points.push({

            x:
                W / 2 +
                x * scale,

            y:
                H / 2 -
                y * scale

        });

    }

    return points;
}


/* MOVE STARS */

function moveToTargets(points) {

    stars.forEach(
        (star, i) => {

            const p =
                points[
                    i % points.length
                ];

            star.tx = p.x;
            star.ty = p.y;

        }
    );
}


/* START */

moveToTargets(
    randomTargets()
);


/* IRA */

setTimeout(
    () => {

        moveToTargets(
            wordTargets("IRA")
        );

    },
    2500
);


/* HEART */

setTimeout(
    () => {

        moveToTargets(
            heartTargets()
        );

    },
    6500
);


/* INTRO OFF */

setTimeout(
    () => {

        document
            .getElementById("intro")
            .style.opacity = "0";

    },
    7000
);


/* FINAL ON */

setTimeout(
    () => {

        document
            .getElementById("final")
            .style.opacity = "1";

    },
    8500
);


/* FIREWORKS */

function fireworks() {

    for (
        let i = 0;
        i < 12;
        i++
    ) {

        const x =
            Math.random() * W;

        const y =
            Math.random() * H;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            Math.random() * 3 + 1,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "rgba(255,120,210," +
            Math.random() +
            ")";

        ctx.shadowBlur = 20;

        ctx.shadowColor =
            "#ff5db1";

        ctx.fill();

        ctx.shadowBlur = 0;
    }
}


/* ANIMATION */

function animate() {

    clearScreen();

    stars.forEach(
        star => star.update()
    );

    if (
        Date.now() % 1000 < 50
    ) {

        fireworks();

    }

    requestAnimationFrame(
        animate
    );
}

animate();


/* TAP TO RESTART */

document.body.addEventListener(
    "click",
    () => {

        location.reload();

    }
);

</script>

</body>
</html>
