<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Ira ✨</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #03020a;
    font-family: Georgia, serif;
}

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
}

/* =========================
   INTRO
========================= */

.intro {
    position: fixed;
    top: 10%;
    width: 100%;
    text-align: center;
    color: rgba(255,255,255,.8);
    font-size: 14px;
    letter-spacing: 5px;
    opacity: 0;
    animation: fadeIn 2s forwards;
    z-index: 5;
}

/* =========================
   FINAL MESSAGE
========================= */

.message {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) scale(.8);

    text-align: center;
    color: white;

    opacity: 0;
    z-index: 10;

    width: 90%;
    pointer-events: none;
}

.message.show {
    animation: messageIn 3s forwards;
}

.kohana {
    font-size: clamp(22px, 5vw, 34px);
    color: #ffbde9;
    letter-spacing: 3px;
    margin-bottom: 10px;

    text-shadow:
        0 0 10px #ff7bd5,
        0 0 25px #ff3dbb;
}

.message h1 {
    font-size: clamp(42px, 10vw, 80px);
    letter-spacing: 12px;
    margin-bottom: 20px;

    text-shadow:
        0 0 10px #fff,
        0 0 30px #ff7bd5,
        0 0 60px #ff3dbb;
}

.message p {
    font-size: clamp(16px, 4vw, 23px);
    line-height: 1.7;
    color: rgba(255,255,255,.92);
}

.ukrainian-line {
    margin-top: 22px;

    font-size: clamp(18px, 4vw, 28px);

    color: #ffd1ef;

    text-shadow:
        0 0 10px #ff6bd1,
        0 0 25px #ff3dbb;
}

.small {
    margin-top: 25px;

    font-size: 13px;
    letter-spacing: 3px;

    color: #ffbde9;
}

/* =========================
   ANIMATIONS
========================= */

@keyframes fadeIn {
    to {
        opacity: 1;
    }
}

@keyframes messageIn {

    from {
        opacity: 0;
        transform:
            translate(-50%, -45%)
            scale(.75);
    }

    to {
        opacity: 1;
        transform:
            translate(-50%, -50%)
            scale(1);
    }
}

/* =========================
   FLOATING SPRINKLES
========================= */

.sprinkles {
    position: fixed;
    inset: 0;

    pointer-events: none;

    z-index: 4;
}

.sprinkle {
    position: absolute;

    color: white;

    font-size: 14px;

    opacity: .5;

    animation:
        float 5s infinite ease-in-out;
}

@keyframes float {

    0%,100% {
        transform:
            translateY(0)
            rotate(0deg);

        opacity: .25;
    }

    50% {
        transform:
            translateY(-30px)
            rotate(180deg);

        opacity: .9;
    }
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<!-- Romantic Ukrainian intro -->

<div class="intro">
    ✦ ДЛЯ ТЕБЕ, КОХАНА ✦
</div>

<!-- Floating stars and sprinkles -->

<div class="sprinkles" id="sprinkles"></div>

<!-- Final romantic message -->

<div class="message" id="message">

    <div class="kohana">
        Кохана...
    </div>

    <h1>IRA</h1>

    <p>
        Out of all the stars in the universe,<br>
        somehow, my eyes found you. ✨
    </p>

    <div class="ukrainian-line">
        Ти особлива для мене ❤️
    </div>

    <div class="small">
        YOU'RE MY FAVORITE LITTLE SURPRISE ✨
    </div>

</div>


<script>

/* =========================
   CANVAS
========================= */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

let W, H;

let particles = [];

let fireworks = [];


/* =========================
   NAME
========================= */

const word = "IRA";


/* =========================
   PIXEL LETTERS
========================= */

const letters = {

    I: [

        "11111",
        "00100",
        "00100",
        "00100",
        "00100",
        "00100",
        "11111"

    ],

    R: [

        "11110",
        "10001",
        "10001",
        "11110",
        "10100",
        "10010",
        "10001"

    ],

    A: [

        "01110",
        "10001",
        "10001",
        "11111",
        "10001",
        "10001",
        "10001"

    ]
};


/* =========================
   RESIZE
========================= */

function resize() {

    W =
        canvas.width =
        window.innerWidth;

    H =
        canvas.height =
        window.innerHeight;

    wordTargets =
        createWordTargets();

    heartTargets =
        createHeartTargets();
}

window.addEventListener(
    "resize",
    resize
);


/* =========================
   RANDOM
========================= */

function random(min, max) {

    return Math.random() *
        (max - min) + min;
}


/* =========================
   PARTICLE
========================= */

class Particle {

    constructor() {

        this.x =
            random(0, W);

        this.y =
            random(0, H);

        this.tx =
            this.x;

        this.ty =
            this.y;

        this.vx = 0;

        this.vy = 0;

        this.size =
            random(1, 2.5);

        this.alpha =
            random(.4, 1);

        this.phase =
            random(
                0,
                Math.PI * 2
            );
    }


    update() {

        const dx =
            this.tx - this.x;

        const dy =
            this.ty - this.y;


        this.vx +=
            dx * .012;

        this.vy +=
            dy * .012;


        this.vx *= .88;

        this.vy *= .88;


        this.x +=
            this.vx;

        this.y +=
            this.vy;


        this.phase += .03;
    }


    draw() {

        const glow =
            this.alpha *
            (
                .65 +
                Math.sin(
                    this.phase
                ) * .35
            );


        ctx.beginPath();


        ctx.fillStyle =
            `rgba(255,255,255,${glow})`;


        ctx.shadowBlur = 10;

        ctx.shadowColor =
            "white";


        ctx.arc(

            this.x,
            this.y,
            this.size,
            0,
            Math.PI * 2

        );


        ctx.fill();


        ctx.shadowBlur = 0;
    }
}


/* =========================
   CREATE PARTICLES
========================= */

for (
    let i = 0;
    i < 180;
    i++
) {

    particles.push(
        new Particle()
    );
}


/* =========================
   WORD TARGETS
========================= */

function createWordTargets() {

    let targets = [];


    const scale =
        Math.min(
            W / 500,
            H / 400
        );


    const pixelSize =
        22 * scale;


    const letterWidth =
        5 * pixelSize;


    const letterHeight =
        7 * pixelSize;


    const spacing =
        3 * pixelSize;


    const totalWidth =
        word.length *
        letterWidth
        +
        (word.length - 1) *
        spacing;


    const startX =
        (W - totalWidth) / 2;


    const startY =
        H / 2 -
        letterHeight / 2;


    for (
        let l = 0;
        l < word.length;
        l++
    ) {

        const pattern =
            letters[word[l]];


        const offsetX =
            startX +
            l *
            (
                letterWidth +
                spacing
            );


        for (
            let row = 0;
            row < pattern.length;
            row++
        ) {

            for (
                let col = 0;
                col < pattern[row].length;
                col++
            ) {

                if (
                    pattern[row][col]
                    === "1"
                ) {

                    targets.push({

                        x:
                            offsetX +
                            col *
                            pixelSize,

                        y:
                            startY +
                            row *
                            pixelSize

                    });
                }
            }
        }
    }


    return targets;
}


/* =========================
   HEART TARGETS
========================= */

function createHeartTargets() {

    let targets = [];


    const count =
        particles.length;


    const scale =
        Math.min(W, H) / 35;


    for (
        let i = 0;
        i < count;
        i++
    ) {

        const t =
            Math.PI * 2 *
            i / count;


        const x =
            16 *
            Math.pow(
                Math.sin(t),
                3
            );


        const y =
            13 *
                Math.cos(t)
            -
            5 *
                Math.cos(2 * t)
            -
            2 *
                Math.cos(3 * t)
            -
            Math.cos(4 * t);


        targets.push({

            x:
                W / 2 +
                x * scale,

            y:
                H / 2 -
                y * scale

        });
    }


    return targets;
}


let wordTargets =
    createWordTargets();


let heartTargets =
    createHeartTargets();


/* =========================
   BACKGROUND
========================= */

function drawBackground() {

    const gradient =
        ctx.createRadialGradient(

            W / 2,
            H / 2,
            0,

            W / 2,
            H / 2,
            Math.max(W, H)

        );


    gradient.addColorStop(
        0,
        "#180a2b"
    );


    gradient.addColorStop(
        .45,
        "#08051a"
    );


    gradient.addColorStop(
        1,
        "#020106"
    );


    ctx.fillStyle =
        gradient;


    ctx.fillRect(
        0,
        0,
        W,
        H
    );
}


/* =========================
   CONNECT STARS
========================= */

function connectParticles() {

    ctx.lineWidth = .5;


    for (
        let i = 0;
        i < particles.length;
        i++
    ) {

        for (
            let j = i + 1;
            j < particles.length;
            j++
        ) {

            const dx =
                particles[i].x -
                particles[j].x;


            const dy =
                particles[i].y -
                particles[j].y;


            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            if (
                distance < 45
            ) {

                const alpha =
                    1 -
                    distance / 45;


                ctx.strokeStyle =
                    `rgba(
                        255,
                        180,
                        235,
                        ${alpha * .3}
                    )`;


                ctx.beginPath();


                ctx.moveTo(

                    particles[i].x,
                    particles[i].y

                );


                ctx.lineTo(

                    particles[j].x,
                    particles[j].y

                );


                ctx.stroke();
            }
        }
    }
}


/* =========================
   FIREWORK
========================= */

class Firework {

    constructor() {

        this.x =
            random(
                W * .15,
                W * .85
            );


        this.y =
            random(
                H * .15,
                H * .55
            );


        this.particles = [];


        for (
            let i = 0;
            i < 45;
            i++
        ) {

            const angle =
                Math.random() *
                Math.PI * 2;


            const speed =
                random(1, 5);


            this.particles.push({

                x: this.x,

                y: this.y,

                vx:
                    Math.cos(angle)
                    * speed,

                vy:
                    Math.sin(angle)
                    * speed,

                life: 1

            });
        }
    }


    update() {

        this.particles
            .forEach(p => {

                p.x += p.vx;

                p.y += p.vy;


                p.vx *= .97;

                p.vy *= .97;


                p.vy += .025;


                p.life -= .018;

            });
    }


    draw() {

        this.particles
            .forEach(p => {

                if (
                    p.life <= 0
                ) return;


                ctx.beginPath();


                ctx.fillStyle =
                    `rgba(
                        255,
                        180,
                        235,
                        ${p.life}
                    )`;


                ctx.shadowBlur =
                    12;


                ctx.shadowColor =
                    "#ff8bdc";


                ctx.arc(

                    p.x,
                    p.y,
                    1.5,
                    0,
                    Math.PI * 2

                );


                ctx.fill();


                ctx.shadowBlur = 0;

            });
    }
}


/* =========================
   FLOATING SPRINKLES
========================= */

const sprinkleContainer =
    document.getElementById(
        "sprinkles"
    );


const symbols = [

    "✦",
    "✧",
    "✨",
    "♡",
    "💫",
    "✦",
    "🌸"

];


for (
    let i = 0;
    i < 35;
    i++
) {

    const s =
        document.createElement(
            "div"
        );


    s.className =
        "sprinkle";


    s.textContent =
        symbols[
            Math.floor(
                Math.random() *
                symbols.length
            )
        ];


    s.style.left =
        Math.random() *
        100 +
        "%";


    s.style.top =
        Math.random() *
        100 +
        "%";


    s.style.animationDelay =
        Math.random() *
        5 +
        "s";


    s.style.fontSize =
        random(10, 22) +
        "px";


    sprinkleContainer
        .appendChild(s);
}


/* =========================
   ANIMATION
========================= */

let startTime =
    performance.now();


function animate(time) {

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    drawBackground();


    const elapsed =
        (time - startTime)
        / 1000;


    /*
       0–2 SECONDS
       RANDOM STARS
    */

    if (
        elapsed < 2
    ) {

        particles.forEach(p => {

            p.tx =
                p.x +
                Math.sin(
                    time * .001 +
                    p.phase
                ) * 10;


            p.ty =
                p.y +
                Math.cos(
                    time * .001 +
                    p.phase
                ) * 10;


            p.update();

            p.draw();

        });
    }


    /*
       2–6 SECONDS
       STARS FORM IRA
    */

    else if (
        elapsed < 6
    ) {

        wordTargets =
            createWordTargets();


        particles.forEach(
            (p, i) => {

                const target =
                    wordTargets[
                        i %
                        wordTargets.length
                    ];


                p.tx =
                    target.x;

                p.ty =
                    target.y;


                p.update();

                p.draw();

            }
        );


        connectParticles();
    }


    /*
       6–10 SECONDS
       IRA TRANSFORMS
       INTO A HEART
    */

    else if (
        elapsed < 10
    ) {

        let progress =
            (elapsed - 6) / 4;


        progress =
            progress *
            progress *
            (
                3 -
                2 * progress
            );


        particles.forEach(
            (p, i) => {

                const wordTarget =
                    wordTargets[
                        i %
                        wordTargets.length
                    ];


                const heartTarget =
                    heartTargets[i];


                p.tx =
                    wordTarget.x +
                    (
                        heartTarget.x -
                        wordTarget.x
                    ) *
                    progress;


                p.ty =
                    wordTarget.y +
                    (
                        heartTarget.y -
                        wordTarget.y
                    ) *
                    progress;


                p.update();

                p.draw();

            }
        );


        connectParticles();
    }


    /*
       AFTER 10 SECONDS
       HEART + FIREWORKS
    */

    else {

        particles.forEach(
            (p, i) => {

                const target =
                    heartTargets[i];


                p.tx =
                    target.x;

                p.ty =
                    target.y;


                p.update();

                p.draw();

            }
        );


        connectParticles();


        if (
            Math.random() < .025 &&
            fireworks.length < 6
        ) {

            fireworks.push(
                new Firework()
            );
        }


        fireworks.forEach(
            f => {

                f.update();

                f.draw();

            }
        );


        fireworks =
            fireworks.filter(
                f =>
                    f.particles.some(
                        p =>
                            p.life > 0
                    )
            );


        if (
            elapsed > 11
        ) {

            document
                .getElementById(
                    "message"
                )
                .classList.add(
                    "show"
                );
        }
    }


    requestAnimationFrame(
        animate
    );
}


requestAnimationFrame(
    animate
);


/* =========================
   CLICK TO RESTART
========================= */

document.body.addEventListener(
    "click",
    () => {

        startTime =
            performance.now();


        fireworks = [];


        document
            .getElementById(
                "message"
            )
            .classList.remove(
                "show"
            );


        particles.forEach(p => {

            p.x =
                random(0, W);

            p.y =
                random(0, H);


            p.tx =
                p.x;

            p.ty =
                p.y;


            p.vx = 0;

            p.vy = 0;

        });
    }
);

</script>

</body>
</html>
